name: ember
description: Ember — a private, local-first habit and streak tracker for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  material_ui: ^1.11.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.5.3
  intl: ">=0.19.0 <1.0.0"
  flutter_local_notifications: 18.0.1
  flutter_timezone: 4.1.1
  timezone: ^0.9.4
  share_plus: ^13.0.0
  file_picker: ^13.3.2
  home_widget: ^0.10.0
  quick_actions: ^1.1.0
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
