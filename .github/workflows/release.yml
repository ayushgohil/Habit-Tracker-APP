name: Release

# Pushing a version tag such as v0.2.0 builds the signed APKs and publishes a
# GitHub Release with them. See docs/RELEASING.md.
#
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free up disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true

      - name: Check out code
        uses: actions/checkout@v4

      - name: Check the tag matches pubspec.yaml
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          PUBSPEC="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')"
          if [ "$NAME" != "$PUBSPEC" ]; then
            echo "::error::Tag $TAG does not match version $PUBSPEC in pubspec.yaml. Update pubspec.yaml, merge it, then tag again."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Load the signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASSWORD" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEY_PASSWORD" ]; then
            echo "::error::The signing key secrets are missing. A release signed with a different key could not update installed copies. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ember.jks"
          {
            echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember.jks"
            echo "EMBER_KEYSTORE_PASSWORD=$KS_PASSWORD"
            echo "EMBER_KEY_ALIAS=$KS_ALIAS"
            echo "EMBER_KEY_PASSWORD=$KS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ github.run_number }}"

      - name: Name the files and show the signing certificate
        run: |
          mkdir -p dist
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            dst="dist/ember-${{ steps.version.outputs.tag }}-${abi}.apk"
            cp "$src" "$dst"
            echo "$abi:"
            "$APKSIGNER" verify --print-certs "$dst" | grep -i "SHA-256" || true
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "${{ steps.version.outputs.tag }}" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --title "Ember ${{ steps.version.outputs.name }}" \
            --generate-notes $FLAGS
