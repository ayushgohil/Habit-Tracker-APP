name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.mode }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]

    steps:
      - name: Free up disk space
        # The runner's disk is nearly full once Android, Flutter and Gradle are
        # in place; drop big tools this build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules || true
          df -h / | tail -1

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated by `flutter create`. Once it is
      # committed to the repo this step is skipped.
      - name: Generate Android platform folder
        run: |
          if [ ! -d android ]; then
            flutter create --org com.nextlyr --project-name ember --platforms android .
          fi

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_dir = Path("android/app")
          gradle_file = app_dir / "build.gradle.kts"
          kotlin_dsl = gradle_file.exists()
          if not kotlin_dsl:
              gradle_file = app_dir / "build.gradle"
          content = gradle_file.read_text()

          if kotlin_dsl:
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content = content.replace(
                      "compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if "coreLibraryDesugaringEnabled" not in content:
                  content = content.replace(
                      "compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true",
                      1,
                  )
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if "desugar_jdk_libs" not in content:
              if "dependencies {" in content:
                  content = content.replace("dependencies {", "dependencies {\n    " + dependency, 1)
              else:
                  content += "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle_file.write_text(content)
          print(f"Enabled core library desugaring in {gradle_file}")
          PY

      - name: Configure release signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::No signing key configured. This APK is signed with a throwaway key, so it cannot update an installed copy. See README, Signing."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ember.jks"
          {
            echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember.jks"
            echo "EMBER_KEYSTORE_PASSWORD=$KS_PASSWORD"
            echo "EMBER_KEY_ALIAS=$KS_ALIAS"
            echo "EMBER_KEY_PASSWORD=$KS_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          python3 - <<'PY'
          import re
          from pathlib import Path

          app_dir = Path("android/app")
          gradle_file = app_dir / "build.gradle.kts"
          kotlin_dsl = gradle_file.exists()
          if not kotlin_dsl:
              gradle_file = app_dir / "build.gradle"
          content = gradle_file.read_text()
          if "EMBER_KEYSTORE_PATH" in content:
              raise SystemExit(0)

          if kotlin_dsl:
              signing = """    signingConfigs {
                  create("ember") {
                      storeFile = file(System.getenv("EMBER_KEYSTORE_PATH"))
                      storePassword = System.getenv("EMBER_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("EMBER_KEY_ALIAS")
                      keyPassword = System.getenv("EMBER_KEY_PASSWORD")
                  }
              }

              """
              use = 'signingConfig = signingConfigs.getByName("ember")'
              content = content.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("ember")')
          else:
              signing = """    signingConfigs {
                  ember {
                      storeFile file(System.getenv("EMBER_KEYSTORE_PATH"))
                      storePassword System.getenv("EMBER_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("EMBER_KEY_ALIAS")
                      keyPassword System.getenv("EMBER_KEY_PASSWORD")
                  }
              }

              """
              use = "signingConfig signingConfigs.ember"
              content = content.replace("signingConfigs.debug", "signingConfigs.ember")

          content = content.replace("    buildTypes {", signing + "    buildTypes {", 1)
          # Debug builds use the same key as release builds.
          content = content.replace("buildTypes {", "buildTypes {\n        debug {\n            " + use + "\n        }", 1)
          # Make sure the release build uses it too.
          release = re.search(r"release\s*\{", content)
          if release and content.count(use) < 2:
              content = content[: release.end()] + "\n            " + use + content[release.end():]
          gradle_file.write_text(content)
          print(f"Configured signing in {gradle_file}")
          PY

      - name: Configure Android notification manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.RECEIVE_BOOT_COMPLETED",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.VIBRATE",
          ]
          existing = {node.get(android + "name") for node in root.findall("uses-permission")}
          for permission in permissions:
              if permission not in existing:
                  ET.SubElement(root, "uses-permission", {android + "name": permission})

          application = root.find("application")
          # The name shown under the launcher icon.
          application.set(android + "label", "Ember")
          receivers = [
              ("com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver", []),
              ("com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver", [
                  "android.intent.action.BOOT_COMPLETED",
                  "android.intent.action.MY_PACKAGE_REPLACED",
                  "android.intent.action.QUICKBOOT_POWERON",
                  "com.htc.intent.action.QUICKBOOT_POWERON",
              ]),
              ("com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver", []),
          ]
          for name, actions in receivers:
              receiver = next((r for r in application.findall("receiver") if r.get(android + "name") == name), None)
              if receiver is None:
                  receiver = ET.SubElement(application, "receiver", {
                      android + "name": name,
                      android + "exported": "false",
                  })
              if actions and receiver.find("intent-filter") is None:
                  intent_filter = ET.SubElement(receiver, "intent-filter")
                  for action in actions:
                      ET.SubElement(intent_filter, "action", {android + "name": action})
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Install the home-screen widget
        run: python3 tool/install_android_widget.py

      - name: Prepare Health Connect
        run: python3 tool/configure_health_connect.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build ${{ matrix.mode }} APK
        run: flutter build apk --${{ matrix.mode }} --build-number=${{ github.run_number }}

      - name: Show signing certificate
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk | grep -i "SHA-256" || true
          fi

      - name: Upload ${{ matrix.mode }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ember-${{ matrix.mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          if-no-files-found: error
          retention-days: 30
