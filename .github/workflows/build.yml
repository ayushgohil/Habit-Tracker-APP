name: Build APKs

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Cancel an older run of the same branch when a newer push arrives.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.mode }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated by `flutter create`. Once it is
      # committed to the repo this step is skipped.
      - name: Generate Android platform folder
        run: |
          if [ ! -d android ]; then
            flutter create --org com.nextlyr --project-name ember --platforms android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build ${{ matrix.mode }} APK
        run: flutter build apk --${{ matrix.mode }} --build-number=${{ github.run_number }}

      - name: Upload ${{ matrix.mode }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ember-${{ matrix.mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          if-no-files-found: error
          retention-days: 30
